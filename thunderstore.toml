# This file is used by the Thunderstore CLI to build and publish your mod to Thunderstore. https://github.com/thunderstore-io/thunderstore-cli

[config]
schemaVersion = "0.0.1"

[package]
namespace = "art0007i"
name = "ImGuiExample"
description = "Example mod for ResoniteImGuiLib"
websiteUrl = "https://github.com/art0007i/ImGuiExample"
containsNsfwContent = false

[package.dependencies] 
ResoniteModding-BepisLoader = "1.4.1"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./build"

[[build.copy]]
source = "./Plugin/bin/Release/ImGuiExample.dll"
target = "plugins/ImGuiExample/"

[[build.copy]]
source = "./Plugin/bin/Release/ImGuiExample.pdb"
target = "plugins/ImGuiExample/"

[[build.copy]]
source = "./LICENSE"
target = "/"

[publish]
repository = "https://thunderstore.io"
communities = ["resonite"]

[publish.categories]
resonite = [ "mods" ] # TODO: Change this to your mod's categories, see https://thunderstore.io/api/experimental/community/resonite/category/ for a list of available categories
